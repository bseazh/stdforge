<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海信标准情报平台 · 标准数据采集与分析</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <link rel="stylesheet" href="std-crawler/frontend/shell.css">
</head>
<body>
    <header class="shell-header" role="banner">
        <a class="workspace-back" href="../index.html#workspace" aria-label="返回标准工作台">← 返回标准工作台</a>
        <h1 class="shell-title">
            <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M2 12h20"></path>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
            </svg>
            海信标准情报平台
        </h1>
        <p class="shell-subtitle">国家标准 · 行业标准 · 地方标准 · 标准计划　|　采集 · 预警 · 竞争分析 · 组织动态</p>
        <div class="shell-status-row">
            <span class="server-badge" id="serverStatus">检测服务连接…</span>
            <a class="mail-link" href="../email-test.html">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                    <path d="m22 7-10 5L2 7"></path>
                </svg>
                收件人管理
            </a>
        </div>
    </header>

    <main class="page-content">
        <div class="static-notice" id="staticNotice" style="display:none">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="16" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
            <span>当前为静态模式：页面无法跨域直连标准平台。请先运行
            <code>node std-crawler/serve-demo.mjs</code>，再访问
            <code>http://127.0.0.1:5277</code> 即可获得真实实时采集与分析。</span>
        </div>

        <nav class="module-tabs" id="moduleTabs" aria-label="功能模块"></nav>

        <div id="appRoot"></div>
    </main>

    <script type="module" src="std-crawler/frontend/app.js"></script>
</body>
</html>
