apiVersion: v1
kind: Namespace
metadata:
  name: stdforge
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: stdforge-nginx
  namespace: stdforge
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      location / {
        try_files $uri $uri/ =404;
      }

      location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stdforge-web
  namespace: stdforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stdforge-web
  template:
    metadata:
      labels:
        app: stdforge-web
    spec:
      automountServiceAccountToken: false
      nodeName: 119.29.242.172
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: site-files
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: site-files
          hostPath:
            path: /home/ubuntu/Project/stdforge
            type: Directory
        - name: nginx-config
          configMap:
            name: stdforge-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: stdforge-web
  namespace: stdforge
spec:
  selector:
    app: stdforge-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stdforge
  namespace: stdforge
spec:
  rules:
    - host: stdforge.hehaizhao.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stdforge-web
                port:
                  number: 80
