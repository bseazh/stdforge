apiVersion: v1
kind: Namespace
metadata:
  name: stdforge
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: stdforge-nginx
  namespace: stdforge
data:
  Caddyfile: |
    :8080 {
      root * /usr/share/caddy

      @private path /.git /.git/* /.github /.github/*
      respond @private 404

      handle /api/* {
        reverse_proxy http://{$NODE_IP}:4175
      }

      file_server
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stdforge-web
  namespace: stdforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stdforge-web
  template:
    metadata:
      labels:
        app: stdforge-web
    spec:
      automountServiceAccountToken: false
      nodeName: 119.29.242.172
      containers:
        - name: caddy
          image: registry-oci-sha2.zeabur.cn/e-69c40ad076bc68ba374cbf9c/s-69c40aec82fb34707a9ee4b0:d-69c50a16b34287b88166f43a
          imagePullPolicy: IfNotPresent
          command: ["/usr/bin/caddy"]
          args: ["run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          volumeMounts:
            - name: site-files
              mountPath: /usr/share/caddy
              readOnly: true
            - name: caddy-config
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
              readOnly: true
      volumes:
        - name: site-files
          hostPath:
            path: /home/ubuntu/Project/stdforge
            type: Directory
        - name: caddy-config
          configMap:
            name: stdforge-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: stdforge-web
  namespace: stdforge
spec:
  selector:
    app: stdforge-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stdforge
  namespace: stdforge
spec:
  rules:
    - host: stdforge.hehaizhao.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stdforge-web
                port:
                  number: 80
