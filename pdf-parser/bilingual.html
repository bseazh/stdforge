<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="标准智编中英文标准草案对照工作台" />
    <title>中英对照 | 标准智编</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="bilingual.css" />
  </head>
  <body>
    <header class="app-header">
      <a class="brand" href="index.html"><span class="brand-mark">智编</span><span><strong>标准智编</strong><small>中英对照输出</small></span></a>
      <div class="parser-header-actions">
        <a class="header-link" href="index.html"><i data-lucide="arrow-left"></i>返回解析工作台</a>
        <div class="server-state ready"><span></span><em>接口化演示页</em></div>
      </div>
    </header>

    <main class="bilingual-page">
      <section class="bilingual-hero compact-hero">
        <div>
          <p>需求一-③ · 中英文版本同步输出</p>
          <h1>中英文标准草案双页对译</h1>
          <span>上游中文标准草案完成后，一键生成右侧英文版；演示区按 A4/PDF 双页摊开效果展示，便于逐页校对和对外交流。</span>
        </div>
      </section>

      <nav class="bilingual-tabs" aria-label="双语工作台">
        <button class="active" type="button" data-workspace-tab="document"><i data-lucide="columns-2"></i>文档对照</button>
        <button type="button" data-workspace-tab="glossary"><i data-lucide="book-open-text"></i>术语库</button>
      </nav>

      <section class="workspace-panel active" data-workspace-panel="document">
        <section class="panel source-control-panel">
          <div class="source-control-row">
            <label class="bilingual-field title-field"><span>文档标题</span><input id="documentTitle" value="QC/T 1196—2023 车载冰箱" /></label>
            <div class="mode-row compact-actions">
              <button class="button primary" id="generateButton"><i data-lucide="sparkles"></i>翻译 / 更新英文版</button>
            </div>
          </div>
          <label class="bilingual-field source-field"><span>上游中文 Markdown</span><textarea id="sourceText"></textarea></label>
        </section>

        <section class="panel bilingual-output-panel">
          <div class="section-heading compact">
            <div><p>PDF 双页预览</p><h2 id="outputTitle">中英文对照结果</h2></div>
            <span class="section-note">左：中文原文 · 右：英文译文</span>
          </div>
          <div class="panel-body">
            <div class="empty-output" id="emptyOutput">
              <i data-lucide="languages"></i>
              <strong>英文版本将在这里生成</strong>
              <span>生成后左侧是一整份中文 Markdown，右侧是一整份英文 Markdown。</span>
            </div>
            <div class="parallel-editor hidden" id="parallelEditor">
              <div class="parallel-heading"><span>中文标准草案</span><i></i><span>English Draft</span></div>
              <div id="segmentList"></div>
            </div>
            <div class="english-editor hidden" id="englishEditor"></div>
            <div class="version-bar">
              <span id="versionInfo">中文 v0 · 英文 v0</span>
              <button class="button primary" id="refreshTranslation"><i data-lucide="refresh-cw"></i>更新英文</button>
              <details class="export-menu">
                <summary><i data-lucide="file-down"></i>导出</summary>
                <div>
                  <button class="button secondary" id="saveZh"><i data-lucide="save"></i>保存中文版本</button>
                  <button class="button secondary" id="saveEn"><i data-lucide="history"></i>保存英文版本</button>
                  <button class="button secondary" id="downloadZh"><i data-lucide="download"></i>下载中文</button>
                  <button class="button secondary" id="downloadEn"><i data-lucide="download"></i>下载英文</button>
                  <button class="button primary" id="downloadParallel"><i data-lucide="file-down"></i>下载对照版</button>
                </div>
              </details>
            </div>
          </div>
        </section>
      </section>

      <section class="workspace-panel" data-workspace-panel="glossary">
        <section class="panel bilingual-glossary-panel">
          <div class="section-heading compact">
            <div><p>术语库</p><h2>制冷行业译法</h2></div>
            <span class="section-note" id="termCount">0 个术语</span>
          </div>
          <div class="panel-body">
            <div class="term-create-row">
              <input id="termZh" placeholder="中文术语" />
              <input id="termEn" placeholder="英文译法" />
              <button class="button secondary" id="addTerm"><i data-lucide="plus"></i></button>
            </div>
            <div class="term-table" id="termTable"></div>
          </div>
        </section>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"><i data-lucide="info"></i><span></span></div>
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script src="bilingual.js"></script>
  </body>
</html>
