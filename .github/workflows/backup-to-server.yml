name: Backup repository to server

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stdforge-server-backup
  cancel-in-progress: true

jobs:
  backup:
    name: Sync main to server
    runs-on: ubuntu-latest

    steps:
      - name: Check out the complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure the SSH deploy key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          printf 'DEPLOY_TARGET=%s@%s\n' "$DEPLOY_USER" "$DEPLOY_HOST" >> "$GITHUB_ENV"

      - name: Synchronize repository backup
        env:
          DEPLOY_PATH: /home/ubuntu/Project/stdforge
        run: |
          ssh "$DEPLOY_TARGET" "mkdir -p '$DEPLOY_PATH'"
          timeout 180s rsync -az --delete --timeout=120 \
            --exclude='.git/' \
            --exclude='.git/index.lock' \
            --exclude='.git/hooks/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='KB/' \
            --exclude='KDB/.system/' \
            --exclude='KDB/*/text/' \
            --exclude='KDB/*/source/' \
            -e 'ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4' \
            ./ "$DEPLOY_TARGET:$DEPLOY_PATH/"

      - name: Provision parser credentials on the deployment server
        env:
          DEPLOY_PATH: /home/ubuntu/Project/stdforge
          MINERU_TOKEN: ${{ secrets.MINERU_TOKEN }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_APPROVAL_CODE: ${{ secrets.FEISHU_APPROVAL_CODE }}
          FEISHU_INITIATOR_OPEN_ID: ${{ secrets.FEISHU_INITIATOR_OPEN_ID }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          test -n "$MINERU_TOKEN"
          test -n "$FEISHU_APP_ID"
          test -n "$FEISHU_APP_SECRET"
          test -n "$FEISHU_APPROVAL_CODE"
          test -n "$FEISHU_INITIATOR_OPEN_ID"
          test -n "$LLM_BASE_URL"
          test -n "$LLM_API_KEY"
          test -n "$LLM_MODEL"
          {
            printf 'MINERU_TOKEN=%s\n' "$MINERU_TOKEN"
            printf 'FEISHU_APP_ID=%s\n' "$FEISHU_APP_ID"
            printf 'FEISHU_APP_SECRET=%s\n' "$FEISHU_APP_SECRET"
            printf 'FEISHU_APPROVAL_CODE=%s\n' "$FEISHU_APPROVAL_CODE"
            printf 'FEISHU_INITIATOR_OPEN_ID=%s\n' "$FEISHU_INITIATOR_OPEN_ID"
            printf 'LLM_BASE_URL=%s\n' "$LLM_BASE_URL"
            printf 'LLM_API_KEY=%s\n' "$LLM_API_KEY"
            printf 'LLM_MODEL=%s\n' "$LLM_MODEL"
          } | base64 | ssh "$DEPLOY_TARGET" "base64 -d > '$DEPLOY_PATH/.env.local' && chmod 600 '$DEPLOY_PATH/.env.local'"

      - name: Install parser runtime dependencies
        env:
          DEPLOY_PATH: /home/ubuntu/Project/stdforge
        run: |
          ssh "$DEPLOY_TARGET" "command -v pdftotext >/dev/null || (sudo -n apt-get update && sudo -n apt-get install -y poppler-utils); cd '$DEPLOY_PATH' && npm ci --omit=dev"

      - name: Restart the PDF parser service
        env:
          DEPLOY_PATH: /home/ubuntu/Project/stdforge
        run: |
          ssh "$DEPLOY_TARGET" "DEPLOY_PATH='$DEPLOY_PATH' sh -s" <<'REMOTE'
          set -eu
          cd "$DEPLOY_PATH"
          mkdir -p pdf-parser/.runtime
          pkill -f 'node .*pdf-parser/server\.mjs' 2>/dev/null || true
          sleep 1
          if [ -f pdf-parser/.runtime/server.pid ]; then
            previous_pid=$(cat pdf-parser/.runtime/server.pid)
            if kill -0 "$previous_pid" 2>/dev/null; then kill "$previous_pid"; fi
          fi
          nohup env HOST=0.0.0.0 PORT=4175 node pdf-parser/server.mjs > pdf-parser/.runtime/server.log 2>&1 &
          echo $! > pdf-parser/.runtime/server.pid
          for attempt in 1 2 3 4 5; do
            sleep 2
            if curl -fsS http://127.0.0.1:4175/api/health; then exit 0; fi
          done
          cat pdf-parser/.runtime/server.log
          exit 1
          REMOTE

      - name: Restart the module two analysis service
        env:
          DEPLOY_PATH: /home/ubuntu/Project/stdforge
        run: |
          ssh "$DEPLOY_TARGET" "DEPLOY_PATH='$DEPLOY_PATH' sh -s" <<'REMOTE'
          set -eu
          cd "$DEPLOY_PATH"
          mkdir -p module2/.runtime
          pkill -f 'node .*module2/std-crawler/serve-demo\.mjs' 2>/dev/null || true
          if [ -f module2/.runtime/server.pid ]; then
            previous_pid=$(cat module2/.runtime/server.pid)
            if kill -0 "$previous_pid" 2>/dev/null; then kill "$previous_pid"; fi
          fi
          nohup env HOST=0.0.0.0 PORT=5277 \
            STD_LLM_BASE_URL="${LLM_BASE_URL:-}" \
            STD_LLM_API_KEY="${LLM_API_KEY:-}" \
            STD_LLM_MODEL="${LLM_MODEL:-}" \
            node module2/std-crawler/serve-demo.mjs > module2/.runtime/server.log 2>&1 &
          echo $! > module2/.runtime/server.pid
          for attempt in 1 2 3 4 5; do
            sleep 2
            if curl -fsS http://127.0.0.1:5277/api/health; then exit 0; fi
          done
          cat module2/.runtime/server.log
          exit 1
          REMOTE

      - name: Apply the online reverse proxy configuration
        env:
          DEPLOY_PATH: /home/ubuntu/Project/stdforge
        run: |
          ssh "$DEPLOY_TARGET" "sudo -n kubectl apply -f '$DEPLOY_PATH/deploy/kubernetes.yaml' && sudo -n kubectl -n stdforge rollout restart deployment/stdforge-web && sudo -n kubectl -n stdforge rollout status deployment/stdforge-web --timeout=120s"
